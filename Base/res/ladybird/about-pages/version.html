<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="color-scheme" content="light dark" />
        <title>About Ladyflock</title>
        <link rel="icon" type="image/png" href="resource://icons/48x48/app-browser.png" />
        <link rel="stylesheet" type="text/css" href="resource://ladybird/ladybird.css" />
        <style>
            body {
                display: flex;
                flex-direction: column;
                align-items: center;
                min-height: 100vh;
                box-sizing: border-box;
                padding: 100px 24px 26px;
            }

            .logomark {
                width: 168px;
                height: 137px;
            }

            :root {
                --mark-light-light: #c674f8;
                --mark-light-back: #9c50da;
                --mark-light-mid: #742dc5;
                --mark-light-deep: #4d0b9e;
                --mark-light-bird: #4e1599;
                --mark-light-solid: #4b22ad;

                --mark-dark-light: #e2b4ff;
                --mark-dark-back: #c68cff;
                --mark-dark-mid: #a567f5;
                --mark-dark-deep: #7d43dc;
                --mark-dark-bird: #d3b8ff;
                --mark-dark-solid: #b496ff;

                --mark-light: var(--mark-light-light);
                --mark-back: var(--mark-light-back);
                --mark-mid: var(--mark-light-mid);
                --mark-deep: var(--mark-light-deep);
                --mark-bird: var(--mark-light-bird);
                --mark-solid: var(--mark-light-solid);
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --mark-light: var(--mark-dark-light);
                    --mark-back: var(--mark-dark-back);
                    --mark-mid: var(--mark-dark-mid);
                    --mark-deep: var(--mark-dark-deep);
                    --mark-bird: var(--mark-dark-bird);
                    --mark-solid: var(--mark-dark-solid);
                }
            }

            @media (prefers-contrast: more) {
                .logomark path {
                    fill: var(--mark-solid);
                }
            }

            .name {
                display: flex;
                align-items: center;
                gap: 12px;
                margin-top: 26px;
            }

            h1 {
                font-size: 40px;
                font-weight: 600;
                letter-spacing: -0.025em;
                line-height: 1;
            }

            .badge {
                margin-top: 2px;
                font-size: 12px;
                font-weight: 600;
                padding: 3px 8px;
                border-radius: 6px;
                color: var(--badge-text);
                background: var(--badge-background);
            }

            .tagline {
                margin-top: 10px;
                font-size: 15px;
                color: var(--muted);
            }

            .details {
                width: 100%;
                max-width: 460px;
                margin-top: 30px;
                padding: 14px 16px 14px 18px;
                box-sizing: border-box;
                border-radius: 8px;
                background: var(--page);
                box-shadow: inset 0 0 0 1px var(--separator);
            }

            .summary {
                display: flex;
                align-items: flex-start;
                gap: 12px;
            }

            .details dl {
                flex: 1;
                display: grid;
                grid-template-columns: 96px minmax(0, 1fr);
                row-gap: 8px;
                font-size: 13px;
                line-height: 1.4;
            }

            .details dt {
                color: var(--muted);
            }

            .details dd {
                overflow-wrap: anywhere;
            }

            .links {
                display: flex;
                gap: 16px;
                margin-top: 14px;
                padding-top: 12px;
                border-top: 1px solid var(--separator);
                font-size: 13px;
            }

            .links a {
                color: var(--link);
                text-decoration: none;
            }

            .links a:hover {
                text-decoration: underline;
            }

            .copy {
                display: flex;
                align-items: center;
                gap: 6px;
                height: 28px;
                padding: 0 10px;
                border: none;
                border-radius: 7px;
                font: inherit;
                font-size: 13px;
                color: var(--text);
                background: var(--control);
                cursor: pointer;
            }

            .copy:hover {
                background: var(--control-hover);
            }

            .copy:active {
                background: var(--control-pressed);
            }

            .copy svg {
                width: 12px;
                height: 12px;
            }
        </style>
    </head>

        <div class="name">
            <h1 id="browser-name">Ladyflock</h1>
            <span class="badge" id="release-stage" hidden></span>
        </div>
        <p class="tagline">An independent browser built on the Ladybird engine.</p>
        <div class="details">
            <div class="summary">
                <dl>
                    <dt>Version</dt>
                    <dd id="browser-version"></dd>
                    <dt>Engine</dt>
                    <dd id="engine-name"></dd>
                    <dt>Built</dt>
                    <dd id="browser-commit"></dd>
                    <dt>Platform</dt>
                    <dd id="platform"></dd>
                </dl>
                <button class="copy" id="copy" type="button">
                    <svg
                        viewBox="0 0 16 16"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.6"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <path d="M5.5 5.5h7v8h-7zM3.5 10.5v-8h7" />
                    </svg>
                    Copy
                </button>
            </div>
            <div class="links">
                <a href="https://github.com/Kayyo321/Ladyflock" target="_blank">Ladyflock on GitHub</a>
                <a href="https://github.com/Kayyo321/Ladyflock/issues" target="_blank">Report an Issue</a>
                <a href="https://ladybird.org/" target="_blank">Ladybird Engine</a>
                <a href="about:licenses" target="_blank">Licenses</a>
            </div>
        </div>
        <script type="module">
            const copyButton = document.querySelector("#copy");
            let detailsText = "";

            function applyMarkColors(markColors) {
                if (!markColors) return;
                const root = document.documentElement.style;
                for (const [scheme, palette] of [
                    ["light", markColors.light],
                    ["dark", markColors.dark],
                ]) {
                    if (!palette) continue;
                    for (const key of ["light", "back", "mid", "deep", "bird", "solid"]) {
                        if (palette[key]) root.setProperty(`--mark-${scheme}-${key}`, palette[key]);
                    }
                }
            }

            function renderVersionInfo(versionInfo) {
                applyMarkColors(versionInfo.markColors);
                document.title = `About ${versionInfo.productName}`;
                document.querySelector("#browser-name").innerText = versionInfo.browserName;

                const stageBadge = document.querySelector("#release-stage");
                if (versionInfo.releaseStage) {
                    stageBadge.innerText = versionInfo.releaseStage;
                    stageBadge.hidden = false;
                } else if (!versionInfo.isReleaseBuild) {
                    stageBadge.innerText = "Development";
                    stageBadge.hidden = false;
                } else {
                    stageBadge.innerText = "";
                    stageBadge.hidden = true;
                }

                const versionText = versionInfo.releaseChannel
                    ? `${versionInfo.browserVersion} (${versionInfo.releaseChannel})`
                    : versionInfo.browserVersion;
                document.querySelector("#browser-version").innerText = versionText;
                const engineName = versionInfo.engineName || "Ladybird";
                document.querySelector("#engine-name").innerText = versionInfo.engineVersion
                    ? `${engineName} (${versionInfo.engineVersion})`
                    : engineName;
                document.querySelector("#browser-commit").innerText = `from ${versionInfo.browserCommit.slice(0, 10)}`;
                document.querySelector("#platform").innerText = `${versionInfo.platformName}, ${versionInfo.arch}`;

                // What is copied includes the details a bug report needs beyond what the page shows.
                const headerName = versionInfo.internalName || versionInfo.productName;
                detailsText = [
                    `${headerName} ${versionInfo.browserVersion} (${versionInfo.browserCommit})`,
                    `Platform: ${versionInfo.platformName}, ${versionInfo.arch}`,
                    `User agent: ${navigator.userAgent}`,
                    `Command line: ${versionInfo.commandLine}`,
                    `Executable path: ${versionInfo.executablePath}`,
                ].join("\n");
            }

            copyButton.addEventListener("click", () => {
                navigator.clipboard.writeText(detailsText);
            });

            document.addEventListener("WebUILoaded", () => {
                ladybird.sendMessage("loadVersionInfo");
            });

            document.addEventListener("WebUIMessage", event => {
                if (event.detail.name === "renderVersionInfo") {
                    renderVersionInfo(event.detail.data);
                } else if (event.detail.name === "markColorChanged") {
                    applyMarkColors(event.detail.data);
                }
            });
        </script>
    </body>
