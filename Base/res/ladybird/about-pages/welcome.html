                <h1>Welcome to Ladyflock</h1>
                <p class="muted">You can change any of this later in Settings.</p>
            </header>
            <fieldset id="setup-options" disabled>
                <section aria-labelledby="search-engine-title">
                    <div class="section-heading">
                        <h2 id="search-engine-title">Search engine</h2>
                        <p class="muted small">Optional</p>
                    </div>
                    <div
                        id="search-engines"
                        class="search-engines"
                        role="radiogroup"
                        aria-labelledby="search-engine-title"
                    ></div>
                    <div id="search-suggestions" class="switch-card control-row hidden">
                        <label for="search-suggestions-enabled">
                            <span id="search-suggestions-title">Show search suggestions</span>
                            <p id="search-suggestions-description" class="muted small description"></p>
                        </label>
                        <input
                            id="search-suggestions-enabled"
                            type="checkbox"
                            switch
                            aria-labelledby="search-suggestions-title"
                            aria-describedby="search-suggestions-description"
                        />
                    </div>
                </section>
                <section id="tab-layout-section" aria-labelledby="tab-layout-title">
                    <h2 id="tab-layout-title">Layout</h2>
                    <div class="tab-options" role="radiogroup" aria-labelledby="tab-layout-title">
                        <label class="tab-option choice-card">
                            <input type="radio" name="tab-layout" value="horizontal" checked />
                            <span class="tab-preview horizontal-preview" aria-hidden="true">
                                <span class="preview-strip"><i class="active"></i><i></i><i></i></span>
                                <span class="preview-toolbar"><i></i></span>
                            </span>
                            <span class="tab-option-label">Tabs on top</span>
                        </label>
                        <label class="tab-option choice-card">
                            <input type="radio" name="tab-layout" value="vertical" />
                            <span class="tab-preview vertical-preview" aria-hidden="true">
                                <span class="preview-sidebar"><i></i><i class="active"></i><i></i></span>
                                <span class="preview-main"
                                    ><span class="preview-toolbar"><i></i></span
                                ></span>
                            </span>
                            <span class="tab-option-label">Tabs on the side</span>
                        </label>
                        <label class="tab-option choice-card">
                            <input type="radio" name="tab-layout" value="sidebar" />
                            <span class="tab-preview vertical-preview" aria-hidden="true">
                                <span class="preview-sidebar"><b></b><i></i><i class="active"></i><i></i></span>
                                <span class="preview-main"></span>
                            </span>
                            <span class="tab-option-label">Everything in the sidebar</span>
                        </label>
                    </div>
                </section>
                <section aria-labelledby="color-theme-title">
                    <h2 id="color-theme-title">Color</h2>
                    <div id="color-theme" class="color-swatches" role="radiogroup" aria-labelledby="color-theme-title">
                        <label class="color-swatch system-swatch" title="System" style="--swatch: #8e8e93">
                            <input type="radio" name="color-theme" value="neutral" aria-label="System" />
                        </label>
                        <label class="color-swatch" title="Harbor" style="--swatch: #2f6fd6">
                            <input type="radio" name="color-theme" value="harbor" aria-label="Harbor" />
                        </label>
                        <label class="color-swatch" title="Glacier" style="--swatch: #1798b8">
                            <input type="radio" name="color-theme" value="glacier" aria-label="Glacier" />
                        </label>
                        <label class="color-swatch" title="Lagoon" style="--swatch: #12957f">
                            <input type="radio" name="color-theme" value="lagoon" aria-label="Lagoon" />
                        </label>
                        <label class="color-swatch" title="Moss" style="--swatch: #3b8f3e">
                            <input type="radio" name="color-theme" value="moss" aria-label="Moss" />
                        </label>
                        <label class="color-swatch" title="Saffron" style="--swatch: #c99500">
                            <input type="radio" name="color-theme" value="saffron" aria-label="Saffron" />
                        </label>
                        <label class="color-swatch" title="Copper" style="--swatch: #d0631c">
                            <input type="radio" name="color-theme" value="copper" aria-label="Copper" />
                        </label>
                        <label class="color-swatch" title="Cherry" style="--swatch: #d1344b">
                            <input type="radio" name="color-theme" value="cherry" aria-label="Cherry" />
                        </label>
                        <label class="color-swatch" title="Blossom" style="--swatch: #d2459a">
                            <input type="radio" name="color-theme" value="blossom" aria-label="Blossom" />
                        </label>
                        <label class="color-swatch" title="Lavender" style="--swatch: #7563d4">
                            <input type="radio" name="color-theme" value="lavender" aria-label="Lavender" />
                        </label>
                    </div>
                </section>
                <section class="switch-list">
                    <div class="switch-row control-row">
                        <label for="enable-content-blocking">
                            <h2 id="ad-blocking-title">Block ads, trackers and more</h2>
                            <p class="muted small description">
                                Pages load faster. If a site breaks, turn it off for that site from the address bar.
                            </p>
                        </label>
                        <input
                            id="enable-content-blocking"
                            type="checkbox"
                            switch
                            aria-labelledby="ad-blocking-title"
                        />
                    </div>
                    <div class="switch-row control-row">
                        <label for="enable-update-checks">
                            <h2 id="update-checks-title">Check for updates</h2>
                            <p class="muted small description">Ladyflock tells you when a newer version is available.</p>
                        </label>
                        <input id="enable-update-checks" type="checkbox" switch aria-labelledby="update-checks-title" />
                    </div>
                    <div id="default-browser" class="switch-row hidden">
                        <label id="default-browser-label">
                            <h2>Default browser</h2>
                            <p id="default-browser-description" class="muted small description" role="status"></p>
                        </label>
                        <button
                            id="make-default-browser"
                            class="secondary-button"
                            type="button"
                            aria-describedby="default-browser-description"
                        >
                            Make default
                        </button>
                    </div>
                </section>
            </fieldset>
            <footer>
                <p id="save-status" class="muted small" role="status"></p>
                <button id="start-browsing" class="primary-button" type="submit" disabled>Start browsing</button>
            </footer>
        </form>
    </body>
</html>
