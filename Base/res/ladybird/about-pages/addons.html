<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Add-ons</title>
        <link rel="icon" type="image/png" href="resource://icons/48x48/app-browser.png" />
        <link rel="stylesheet" href="resource://ladybird/ladybird.css" />
        <link rel="stylesheet" href="resource://ladybird/about-pages/webui.css" />
        <link rel="stylesheet" href="resource://ladybird/about-pages/addons.css" />
        <script type="module" src="resource://ladybird/about-pages/addons.js"></script>
    </head>
    <body>
        <header>
            <h1>Add-ons</h1>
            <button id="pick-file" class="secondary-button" disabled>Install from File...</button>
        </header>
        <main>
            <p id="notice" role="status"></p>
            <section aria-labelledby="installed-heading">
                <div class="card-title">
                    <h2 id="installed-heading" tabindex="-1">Installed extensions</h2>
                    <div class="controls" id="update-controls" hidden>
                        <button class="secondary-button" id="check-updates">Check for Updates</button>
                        <button class="primary-button" id="update-all" hidden></button>
                    </div>
                </div>
                <div class="card card-body" id="installed">
                    <p class="description">Loading extensions…</p>
                </div>
            </section>
            <section aria-labelledby="catalog-heading">
                <h2 class="card-title" id="catalog-heading">Find extensions</h2>
                <div class="card card-body">
                    <form role="search" id="catalog-search">
                        <label for="query">Search Mozilla Add-ons</label>
                        <div class="controls">
                            <input
                                id="query"
                                type="search"
                                placeholder="Extension name or keyword"
                                maxlength="100"
                                required
                                disabled
                            />
                            <button class="primary-button" id="search" disabled>Search</button>
                        </div>
                    </form>
                    <p id="catalog-status" class="description" role="status"></p>
                    <div id="results"></div>
                    <nav id="pages" class="controls" aria-label="Search result pages" hidden>
                        <button class="secondary-button" id="previous">Previous</button>
                        <span id="page-number"></span>
                        <button class="secondary-button" id="next">Next</button>
                    </nav>
                </div>
            </section>
        </main>
        <template id="extension-icon-template">
            <span class="extension-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M4 5h5V4a2.5 2.5 0 0 1 5 0v1h5v5h1a2.5 2.5 0 0 1 0 5h-1v5h-5v-1a2.5 2.5 0 0 0-5 0v1H4v-5h1a2.5 2.5 0 0 0 0-5H4z" />
                </svg>
            </span>
        </template>
        <template id="update-hint-template">
            <svg class="update-hint" viewBox="0 0 16 16" aria-hidden="true">
                <circle cx="8" cy="8" r="7" />
                <path d="M8 11.5V4.5M5 7.5l3-3 3 3" />
            </svg>
        </template>
        <dialog aria-labelledby="review-title" id="review">
            <h2 id="review-title"></h2>
            <div id="review-body" tabindex="0" role="region" aria-label="Review details"></div>
            <div class="controls" id="review-actions">
                <button class="secondary-button" id="cancel" autofocus>Cancel</button>
                <button class="primary-button" id="confirm"></button>
            </div>
        </dialog>
    </body>
</html>
