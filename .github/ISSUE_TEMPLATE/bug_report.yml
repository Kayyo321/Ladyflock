name: Report a bug
description: Create a report to help us reproduce and fix a bug in Ladyflock.
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the problem in 1 or 2 short sentences.
      placeholder: When I … in Ladyflock, …
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: input
    id: distro-package
    attributes:
      label: Distro/package (if Linux)
      description: Say which distro and version you’re on — and, unless you built Ladyflock from source yourself, which package you installed it from.
      placeholder: Ubuntu 24.04, built from source
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      description: Pick what the Platform field shows on the About Ladyflock page (see below).
      options:
        - x86_64
        - AArch64
        - Other
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit hash
      description: Go to Ladyflock > About Ladyflock (or open `about:version`), and copy the hash from the Built field or Copy output.
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to reproduce
      description: Describe the exact steps we can follow to reproduce the problem.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: Describe what you expected to happen when you followed [the steps you described above](#description-reproduction-steps).
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: Describe what actually happened when you followed [the steps you described above](#description-reproduction-steps).
    validations:
      required: true
  - type: markdown
    id: reduced-test-case
    attributes:
      value: |
        &nbsp; <!-- add some vertical whitespace -->
        ## Reduced test case
        Either provide the URL for a [reduced test case](https://github.com/Kayyo321/Ladyflock/blob/ladyflock/ISSUES.md#how-you-can-write-a-reduced-test-case) that reproduces the problem, or else HTML/SVG/etc. source for a reduced test case.
        > [!IMPORTANT]
        > A [reduced test case](https://github.com/Kayyo321/Ladyflock/blob/ladyflock/ISSUES.md#how-you-can-write-a-reduced-test-case) may be the most important thing you can give us; without it, we’re much less likely to isolate the cause.
  - type: input
    id: reduced-test-case-url
    attributes:
      label: URL for a reduced test case
      description: |
        Provide the URL for a [reduced test case](https://github.com/Kayyo321/Ladyflock/blob/ladyflock/ISSUES.md#how-you-can-write-a-reduced-test-case) that reproduces the problem (e.g., using a site such as [CodePen](https://codepen.io/pen/), [JS Bin](https://jsbin.com), or [JSFiddle](https://jsfiddle.net)). Or if you don’t have a [reduced test case](https://github.com/Kayyo321/Ladyflock/blob/ladyflock/ISSUES.md#how-you-can-write-a-reduced-test-case), at least provide the URL for a website/page that causes the problem. Otherwise just enter `N/A` here.
    validations:
      required: true
  - type: textarea
    id: reduced-test-case-source
    attributes:
      label: HTML/SVG/etc. source for a reduced test case
      description: If you’ve not provided the URL for a [reduced test case](https://github.com/Kayyo321/Ladyflock/blob/ladyflock/ISSUES.md#how-you-can-write-a-reduced-test-case) that reproduces the problem, then paste in below the HTML/SVG/etc. source for a reduced test case. Otherwise just enter `N/A` here. What you paste in will be formatted as a code block — so, no need to put code fence backticks around it.
      value:
      render: html
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        &nbsp; <!-- add some vertical whitespace -->
  - type: textarea
    id: log-output
    attributes:
      label: |
        Log output and (if possible) backtrace
      description: |
        Copy and paste the full log output from Ladyflock — including error messages — as well as any backtrace that Ladyflock reported.
        What you paste in will be formatted as a code block — so, no need to put code fence backticks around it.
      value:
      render: shell
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recordings
      description: Drag and drop in below any screenshots or screen recordings you’ve made which show the problem.
  - type: textarea
    id: build-flags
    attributes:
      label: Build flags or config settings
      description: If you’re building with any non-default build flags or other non-default config settings in your environment, list them out below.
